<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TLY Properties</title>
<style>
:root{--bg:#f3f1ec;--fg:#1b2b24;--mut:#6b756f;--card:#fff;--chip:#e0ece6;--line:#e4dfd6;--g:#1f5c46;--red:#c8102e;--save:#0a7d4f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101513;--fg:#eef3f0;--mut:#9aa8a1;--card:#18201c;--chip:#23332b;--line:#2b3832;--g:#3a8f6d;--red:#ff5a6e;--save:#4ad08e}}
:root[data-theme="dark"]{--bg:#101513;--fg:#eef3f0;--mut:#9aa8a1;--card:#18201c;--chip:#23332b;--line:#2b3832;--g:#3a8f6d;--red:#ff5a6e;--save:#4ad08e}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--fg);font-family:Roboto,system-ui,sans-serif}
main{max-width:560px;margin:auto;padding:14px 16px 40px}
.hd{display:flex;align-items:center;gap:10px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.lg{background:var(--g);color:#fff;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none}
.hd b{flex:1;font-size:19px;line-height:1.2}button{font:inherit;cursor:pointer}
.pill{border:1.5px solid var(--line);background:var(--card);color:var(--fg);border-radius:14px;padding:11px 16px}
.pri{background:var(--g);color:#fff;border:0;border-radius:14px;padding:14px 20px;font-size:16px}
h1{font-size:32px;margin:26px 0 6px}p.s{color:var(--mut);line-height:1.5;margin:0 0 14px}
input,select{width:100%;border:1.5px solid var(--line);background:var(--card);color:var(--fg);border-radius:14px;padding:13px 16px;font:inherit;font-size:16px}
.fold{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:24px;padding:22px;margin:14px 0;color:var(--fg)}
.ic{width:50px;height:50px;border-radius:14px;background:var(--chip);display:grid;place-items:center;font-size:24px;margin-bottom:22px}
.fold b{font-size:24px;display:block}.fold span{color:var(--mut)}
.card{border:1.5px solid var(--line);border-radius:24px;overflow:hidden;background:var(--card);margin:16px 0}
.top{background:linear-gradient(135deg,#143d2e,#2a7a5c);color:#fff;padding:18px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{background:rgba(255,255,255,.2);border-radius:99px;padding:7px 13px;font-weight:700;font-size:12px;text-transform:uppercase}
.hot{background:#fbd75b;color:#1c1d20;border-radius:99px;padding:7px 13px;font-weight:700;font-size:13px}
.top h2{font-size:24px;margin:20px 0 6px}.bd{padding:16px}.loc{color:var(--g);font-weight:800;text-transform:uppercase;font-size:14px}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.pills span{background:var(--chip);border-radius:99px;padding:7px 13px;font-size:14px}
.st{display:grid;grid-template-columns:1fr 1fr;gap:10px}.st div{border:1.5px solid var(--line);border-radius:16px;padding:12px}.st small{color:var(--mut);display:block}.st b{font-size:21px}
.mv{text-decoration:line-through;color:var(--mut);margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.pr{font-size:36px;font-weight:900;color:var(--red)}.sv{color:var(--save);font-weight:700}
.ac{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.ac>*{border:0;border-radius:16px;padding:14px;font-weight:700;font-size:15px;text-align:center;text-decoration:none;background:var(--fg);color:var(--bg)}
.ac .wa{background:#25d366;color:#06220f}.ac .sm{background:var(--chip);color:var(--fg)}
dialog{border:0;border-radius:22px;background:var(--bg);color:var(--fg);width:min(94vw,460px);max-height:90vh;padding:18px}
dialog::backdrop{background:rgba(0,0,0,.6)}dialog label{display:block;margin:12px 0 4px;font-weight:700;font-size:14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ph{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.ph div{position:relative}.ph img{width:84px;height:84px;object-fit:cover;border-radius:12px}
.ph button{position:absolute;top:2px;right:2px;border:0;border-radius:99px;width:24px;height:24px;background:#000a;color:#fff}
.big img{width:100%;border-radius:14px;margin-bottom:8px}
</style></head><body><main>
<div class="hd"><div class="lg">⌂</div><b>TLY Properties</b><button class="pill" id="tb" onclick="theme()">Dark</button><button class="pill" id="lb" onclick="authBtn()" aria-label="Login" style="display:grid;place-items:center"></button></div>
<div id="app"><p class="s" style="margin-top:20px">Loading…</p></div>
</main>

<dialog id="ld"><h3>Owner login</h3><label>Email</label><input id="le" type="email" autocomplete="username"><label>Password</label><input id="lp" type="password" autocomplete="current-password" onkeydown="if(event.key=='Enter')doLogin()"><p class="s" id="lm" style="color:var(--red);margin-top:10px"></p>
<div class="ac"><button onclick="doLogin()">Login</button><button class="sm" onclick="ld.close()">Cancel</button></div></dialog>

<dialog id="cdlg"><h3>My contact details</h3><p class="s">Shown on the WhatsApp and Share buttons.</p>
<label>Name</label><input id="cn"><label>WhatsApp number (no + or spaces)</label><input id="cp" inputmode="tel" placeholder="60123456789">
<div class="ac"><button onclick="saveC()">Save</button><button class="sm" onclick="cdlg.close()">Close</button></div></dialog>

<dialog id="fd"><h3 id="ft">Add property</h3>
<label>Category</label><select id="f_type"></select>
<label>Title / project</label><input id="f_title" placeholder="NOVO Ampang – N-29-03">
<label>Description</label><input id="f_sub" placeholder="Type A2 · Service Apartment · Dual Key">
<label>Location</label><input id="f_loc" placeholder="Kuala Lumpur / Jalan Ampang">
<label>Details (separate with commas)</label><input id="f_tags" placeholder="686 sqft, Freehold, Fully Furnished, 1 Parking, Tenanted">
<div class="g2"><div><label>Monthly rental (RM)</label><input id="f_rent" type="number" inputmode="numeric"></div><div><label>Market value (RM)</label><input id="f_mkt" type="number" inputmode="numeric"></div></div>
<label>Asking price (RM)</label><input id="f_price" type="number" inputmode="numeric">
<label><input id="f_hot" type="checkbox" style="width:auto;margin-right:8px">Hot Deal</label>
<label>Photos</label><input id="f_files" type="file" accept="image/*" multiple onchange="addPh(this)"><div class="ph" id="f_ph"></div>
<div class="ac"><button id="fsave" onclick="saveL()">Save</button><button class="sm" onclick="fd.close()">Cancel</button></div></dialog>

<dialog id="pd"><div class="big" id="pb"></div><div class="ac"><button style="grid-column:1/3" onclick="pd.close()">Close</button></div></dialog>

<script>
const CATS=["Residential","Commercial","Industrial","Land","Warehouse","Office"],ICON={Land:"⛰"};
const $=i=>document.getElementById(i),fmt=n=>"RM"+Number(n).toLocaleString("en-MY"),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
let ONLY=new URLSearchParams(location.search).get("p")||"",LST=[],SET={},token=ls.get("tly_token")||"",view=null,q="",editId=null,tmp=[],busy=false;
const SV='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">',
ICIN=SV+'<path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg>',
ICOUT=SV+'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>';
async function api(p,o={}){const r=await fetch("/api/"+p,{...o,headers:{"content-type":"application/json",...(token?{authorization:"Bearer "+token}:{})}});const d=await r.json().catch(()=>({}));if(r.status===401&&token&&p!=="login"){logout(true)}if(!r.ok)throw new Error(d.error||"Request failed");return d}
function updateAuth(){$("lb").innerHTML=token?ICOUT:ICIN;$("lb").setAttribute("aria-label",token?"Logout":"Login")}
function logout(silent){token="";ls.del("tly_token");updateAuth();render();if(silent)alert("Session expired. Please log in again.")}
function authBtn(){if(token){logout()}else{$("lm").textContent="";$("lp").value="";ld.showModal()}}
async function doLogin(){try{const d=await api("login",{method:"POST",body:JSON.stringify({email:$("le").value,pin:$("lp").value})});token=d.token;ls.set("tly_token",token);ld.close();updateAuth();render()}catch(e){$("lm").textContent=e.message}}
function applyTheme(){const t=ls.get("tly_theme"),r=document.documentElement;if(t)r.dataset.theme=t;else delete r.dataset.theme;$("tb").textContent=isDark()?"Light":"Dark"}
function isDark(){const t=document.documentElement.dataset.theme;return t?t=="dark":matchMedia("(prefers-color-scheme:dark)").matches}
function theme(){ls.set("tly_theme",isDark()?"light":"dark");applyTheme()}
async function saveC(){try{await api("settings",{method:"POST",body:JSON.stringify({name:$("cn").value.trim(),phone:$("cp").value})});SET={name:$("cn").value.trim(),phone:$("cp").value.replace(/\D/g,"")};cdlg.close();render()}catch(e){alert(e.message)}}
async function refresh(){try{const d=await api("listings");LST=d.listings;SET=d.settings||{};$("cn").value=SET.name||"";$("cp").value=SET.phone||""}catch(e){$("app").innerHTML='<p class="s">Could not load listings. '+esc(e.message)+'</p>';return}render()}
function render(){const A=$("app"),S=!!token;
if(ONLY){const x=LST.find(l=>l.id==ONLY);A.innerHTML=`<p class="s" style="margin-top:18px"><button class="pill" onclick="ONLY='';history.replaceState(null,'','/');render()">← All properties</button></p>`+(x?card(x):'<p class="s">This property is no longer available.</p>');return}
if(view===null&&!q){A.innerHTML=`<h1>Property archive</h1><p class="s">Search for an address, or choose a category.</p>
<input id="q" placeholder="Search ${LST.length} address${LST.length==1?"":"es"} in all categories" oninput="q=this.value;render()" style="margin-bottom:14px">${S?'<button class="pri" onclick="openForm()">Add property</button> <button class="pill" onclick="cdlg.showModal()">My contact details</button>':""}`+
CATS.map(c=>{const n=LST.filter(l=>l.type==c).length;return `<button class="fold" onclick="view='${c}';render()"><div class="ic">${ICON[c]||"🗀"}</div><b>${c}</b><span>${n} address${n==1?"":"es"}</span></button>`}).join("");return}
const L=LST.filter(l=>(view===null||l.type==view)&&(l.title+l.loc+l.sub).toLowerCase().includes(q.toLowerCase()));
A.innerHTML=`<h1>${view||"Search results"}</h1><p class="s"><button class="pill" onclick="view=null;q='';render()">← All categories</button></p>
<input id="q" value="${esc(q)}" placeholder="Search ${view||"all categories"}" oninput="q=this.value;render()"><div style="margin:14px 0">${S?`<button class="pri" onclick="openForm(null,'${view||""}')">Add property</button>`:""}</div>`+
(L.length?L.map(card).join(""):`<p class="s">No properties here yet.</p>`);
if(q){const i=$("q");i.focus();i.setSelectionRange(q.length,q.length)}}
function card(x){const y=x.rent&&x.price?(x.rent*12/x.price*100).toFixed(2)+"% p.a.":"–",sv=(x.mkt||0)-x.price,pc=x.mkt?(sv/x.mkt*100).toFixed(2):0;
return `<div class="card"><div class="top"><div class="row"><span class="tag">${esc(x.type)}</span>${x.hot?'<span class="hot">Hot Deal</span>':""}</div><h2>${esc(x.title)}</h2><div>${esc(x.sub)}</div></div>
<div class="bd"><div class="loc">${esc(x.loc)}</div><div class="pills">${(x.tags||[]).map(t=>`<span>${esc(t)}</span>`).join("")}</div>
<div class="st"><div><small>Monthly Rental</small><b>${x.rent?fmt(x.rent):"–"}</b></div><div><small>Gross Rental Yield</small><b>${y}</b></div></div>
${x.mkt?`<div class="mv">Market Value ${fmt(x.mkt)}</div>`:""}<div class="pr">${fmt(x.price)}</div>
${x.mkt&&sv>0?`<div class="sv">Save ${fmt(sv)} · ${pc}% below market value</div>`:""}
<div class="ac"><button onclick="showPh('${x.id}')">📷 View Photos (${x.n})</button><a class="wa" target="_blank" rel="noopener" href="https://wa.me/${SET.phone||""}?text=${encodeURIComponent("Hi, I’m interested in "+x.title+" ("+fmt(x.price)+")")}">WhatsApp</a>
<button class="sm" onclick="share('${x.id}')">Share</button>${token?`<button class="sm" onclick="openForm('${x.id}')">Edit</button><button class="sm" style="grid-column:1/3" onclick="del('${x.id}')">Delete</button>`:""}</div></div></div>`}
async function showPh(id){const x=LST.find(l=>l.id==id);$("pb").innerHTML=`<h3>${esc(x.title)}</h3><p class="s">Loading…</p>`;pd.showModal();
try{const d=await api("photos/"+id);$("pb").innerHTML=`<h3>${esc(x.title)}</h3>`+(d.photos.length?d.photos.map(u=>`<img src="${u}">`).join(""):`<p class="s">No photos yet.</p>`)}catch(e){$("pb").innerHTML=`<p class="s">${esc(e.message)}</p>`}}
function share(id){const x=LST.find(l=>l.id==id);
const t=`${x.title}\n${x.loc}\nAsking ${fmt(x.price)}${x.mkt?` (market ${fmt(x.mkt)})`:""}\nContact: ${SET.name||""} ${SET.phone||""}\n${location.origin}/?p=${x.id}`;
if(navigator.share)navigator.share({title:x.title,text:t}).catch(()=>{});else window.open("https://wa.me/?text="+encodeURIComponent(t),"_blank")}
async function del(id){if(!confirm("Delete this property?"))return;try{await api("listing/"+id,{method:"DELETE"});await refresh()}catch(e){alert(e.message)}}
async function openForm(id,cat){editId=id||null;const x=id?LST.find(l=>l.id==id):{type:cat||CATS[0],title:"",sub:"",loc:"",tags:[],rent:"",mkt:"",price:"",hot:false};
$("f_type").innerHTML=CATS.map(c=>`<option>${c}</option>`).join("");
$("ft").textContent=id?"Edit property":"Add property";$("f_type").value=x.type;$("f_title").value=x.title;$("f_sub").value=x.sub;$("f_loc").value=x.loc;$("f_tags").value=(x.tags||[]).join(", ");
$("f_rent").value=x.rent;$("f_mkt").value=x.mkt;$("f_price").value=x.price;$("f_hot").checked=!!x.hot;$("f_files").value="";tmp=[];phs();fd.showModal();
if(id){try{tmp=(await api("photos/"+id)).photos;phs()}catch(e){}}}
function phs(){$("f_ph").innerHTML=tmp.map((u,i)=>`<div><img src="${u}"><button onclick="tmp.splice(${i},1);phs()">×</button></div>`).join("")}
function addPh(inp){[...inp.files].forEach(f=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const m=900,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);tmp.push(c.toDataURL("image/jpeg",.75));phs()};im.src=r.result};r.readAsDataURL(f)})}
async function saveL(){const title=$("f_title").value.trim(),price=+$("f_price").value;if(!title||!price){alert("Please enter a title and asking price.");return}
if(busy)return;busy=true;$("fsave").textContent="Saving…";
const x={id:editId||"p"+Date.now(),type:$("f_type").value,title,sub:$("f_sub").value.trim(),loc:$("f_loc").value.trim(),tags:$("f_tags").value.split(",").map(s=>s.trim()).filter(Boolean),rent:+$("f_rent").value||0,mkt:+$("f_mkt").value||0,price,hot:$("f_hot").checked,photos:tmp};
try{await api("listing",{method:"POST",body:JSON.stringify(x)});fd.close();await refresh()}catch(e){alert(e.message)}busy=false;$("fsave").textContent="Save"}
applyTheme();updateAuth();refresh();
</script></body></html>
